name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    # The matrix covers the floor declared in mix.exs (~> 1.15) and the
    # current release, so a version-specific regression cannot slip in
    # unnoticed. Elixir/OTP pairs must be compatible: 1.15 supports OTP
    # 24-26, 1.17 supports 25-27, 1.19 supports 26-28.
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15"
            otp: "26.2"
          - elixir: "1.17"
            otp: "27.2"
          - elixir: "1.19"
            otp: "28.0"
            lint: true

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      # Formatting is checked on one version only: the formatter's output
      # changes between Elixir releases, so running it everywhere would
      # fail for reasons unrelated to the code.
      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - run: mix test

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28.0"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-docs-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get

      # ex_doc fails the build on broken references, so this also checks
      # that every `MyModule.fun/1` mentioned in the docs actually exists.
      - run: mix docs --warnings-as-errors
